d-fill { flex:1 1 0; min-width:0; }\n  .od-fixed { flex:none; }\n  .od-grid { display:grid; gap:var(--od-gap,12px); grid-template-columns:repeat(var(--od-cols,3),minmax(0,1fr)); }\n  .od-stat,.od-field,.od-cell { display:grid; gap:var(--od-gap,2px); }\n  :where(.od-stat,.od-field,.od-cell) > :where(*) { display:block; }\n  .od-tile { display:grid; grid-template-rows:auto 1fr; }\n  :where(.od-tile) > :where(*) { display:block; }\n  .od-media { display:block; width:100%; height:auto; aspect-ratio:var(--od-ratio,auto); }\n  .od-media-cover { object-fit:cover; }\n  .od-icon { display:inline-block; inline-size:var(--od-icon-size,1em); block-size:var(--od-icon-size,1em); flex:none; }\n  .od-truncate { display:block; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }\n  .od-clamp-2,.od-clamp-3 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }\n  .od-clamp-2 { -webkit-line-clamp:2; }\n  .od-clamp-3 { -webkit-line-clamp:3; }\n  .od-lines-2 { min-height:calc(2 * 1.4em); }\n  .od-nowrap { white-space:nowrap; }\n  .od-keep { word-break:keep-all; overflow-wrap:anywhere; }\n  .od-screen { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; }\n  .od-scroll { overflow-y:auto; overscroll-behavior:contain; min-height:0; }\n  .od-rail { display:flex; gap:var(--od-gap,8px); overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; padding-inline:var(--od-rail-pad,16px); scroll-padding-inline:var(--od-rail-pad,16px); }\n  .od-rail::-webkit-scrollbar { display:none; }\n  :where(.od-rail) > :where(*) { flex:none; scroll-snap-align:start; }\n  :where(.od-rail) > :where(:last-child) { margin-inline-end:var(--od-rail-pad,16px); }\n  .od-spacer { flex:none; visibility:hidden; pointer-events:none; }\n  .od-touch { min-width:44px; min-height:44px; }\n}\n/* /OD-LAYOUT-PRIMITIVES v1 */\n  </style>\n  <style>@font-face{font-family:'Plus Jakarta Sans';src:url('data:font/woff2;base64,d09GMgABAAAAAG , \"Segoe UI\", sans-serif;\n      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;\n\n      /* scale — clamp() so it works at 1280, 1440, 1920 without media queries */\n      --fs-h1: clamp(44px, 6vw, 76px);\n      --fs-h2: clamp(32px, 4vw, 48px);\n      --fs-h3: 22px;\n      --fs-lead: 19px;\n      --fs-body: 16px;\n      --fs-meta: 13px;\n\n      /* spacing — 8-point grid */\n      --gap-xs: 8px;\n      --gap-sm: 12px;\n      --gap-md: 20px;\n      --gap-lg: 32px;\n      --gap-xl: 56px;\n      --gap-2xl: 96px;\n      --container: 1120px;\n      --gutter: 32px;\n\n      --radius: 10px;\n      --radius-lg: 16px;\n    }\n\n    /* ─── reset & base ──────────────────────────────────────────────── */\n    *, *::before, *::after { box-sizing: border-box; }\n    html { -webkit-text-size-adjust: 100%; }\n    body {\n      margin: 0;\n      background: var(--bg);\n      color: var(--fg);\n      font-family: var(--font-body);\n      font-size: var(--fs-body);\n      line-height: 1.55;\n      text-rendering: optimizeLegibility;\n      -webkit-font-smoothing: antialiased;\n    }\n    img, svg { display: block; max-width: 100%; }\n    a { color: inherit; text-decoration: none; }\n    button { font: inherit; cursor: pointer; }\n    p { text-wrap: pretty; }\n    h1, h2, h3, h4 { text-wrap: balance; }\n\n    /* ─── layout primitives ─────────────────────────────────────────── */\n    .container {\n      max-width: var(--container);\n      margin-inline: auto;\n      padding-inline: var(--gutter);\n    }\n    .section {\n      padding-block: clamp(48px, 8vw, var(--gap-2xl));\n    }\n    .section + .section { border-top: 1px solid var(--border); }\n    .stack { display: flex; flex-direction: column; }\n    .stack > * + * { margin-top: var(--gap-md); }\n    .row { display: flex; align-items: center; gap: var(--gap-md); }\n    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }\n    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }\n    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }\n    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }\n    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }\n    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }\n    @media (max-width: 920px) {\n      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }\n    }\n\n    /* ─── type ──────────────────────────────────────────────────────── */\n    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }\n    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }\n    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }\n    .lead   { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }\n    .eyebrow {\n      font-family: var(--font-mono);\n      font-size: 12px;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      color: var(--accent);\n      margin: 0 0 var(--gap-md);\n    }\n    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }\n    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n\n    /* ─── chrome: nav + footer ──────────────────────────────────────── */\n    .topnav {\n      position: sticky; top: 0; z-index: 10;\n      background: color-mix(in oklch, var(--bg) 92%, transparent);\n      backdrop-filter: blur(12px);\n      border-bottom: 1px solid var(--border);\n    }\n    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }\n    .topnav .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }\n    .topnav nav { display: flex; gap: var(--gap-lg); }\n    .topnav nav a { font-size: 14px; color: var(--muted); }\n    .topnav nav a:hover { color: var(--fg); }\n    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }\n    .pagefoot .row-between { flex-wrap: wrap; gap: var(--gap-md); }\n\n    /* ─── buttons ───────────────────────────────────────────────────── */\n    .btn {\n      display: inline-flex; align-items: center; gap: 8px;\n      padding: 11px 20px;\n      border-radius: var(--radius);\n      border: 1px solid transparent;\n      font-size: 15px;\n      font-weight: 500;\n      letter-spacing: -0.005em;\n      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;\n    }\n    .btn:active { transform: translateY(1px); }\n    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }\n    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }\n    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }\n    .btn-secondary:hover { border-color: var(--fg); }\n    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 8px; }\n    .btn-ghost:hover { color: var(--accent); }\n    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }\n    .btn-arrow:hover::after { transform: translateX(2px); }\n\n    /* ─── card / surface ────────────────────────────────────────────── */\n    .card {\n      background: var(--surface);\n      border: 1px solid var(--border);\n      border-radius: var(--radius-lg);\n      padding: 28px;\n    }\n    .card-flat { background: transparent; border: 0; padding: 0; }\n    .card-rule { background: transparent; border: 0; border-top: 1px solid var(--fg); padding: 24px 0 0; border-radius: 0; }\n\n    /* ─── feature cell (i ground: transparent;\n      color: var(--muted);\n      border: 1px solid var(--border);\n      border-radius: 999px;\n      font-size: 12px;\n    }\n\n    /* ─── form field ────────────────────────────────────────────────── */\n    .field { display: flex; flex-direction: column; gap: 6px; }\n    .field label { font-size: 13px; color: var(--muted); }\n    .input, .textarea {\n      width: 100%;\n      padding: 11px 14px;\n      border: 1px solid var(--border);\n      border-radius: var(--radius);\n      background: var(--surface);\n      color: var(--fg);\n      font: inherit;\n      font-size: 15px;\n    }\n    .input:focus, .textarea:focus {\n      outline: 2px solid var(--accent-soft);\n      border-color: var(--accent);\n    }\n    .textarea { min-height: 96px; resize: vertical; line-height: 1.55; }\n\n    /* ─── table (data-style, no chrome) ─────────────────────────────── */\n    .ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }\n    .ds-table th, .ds-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }\n    .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }\n    .ds-table tbody tr:hover { background: var(--fg-soft); }\n    .ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }\n\n    /* ─── image placeholder (DS-tinted block, never broken <img>) ──── */\n    .ph-img {\n      background:\n        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),\n        var(--surface);\n      border: 1px solid var(--border);\n      border-radius: var(--radius-lg);\n      aspect-ratio: 16 / 10;\n      display: grid; place-items: center;\n      color: var(--muted);\n      font-family: var(--font-mono);\n      font-size: 12px;\n      letter-spacing: 0.04em;\n    }\n    .ph-img.square    { aspect-ratio: 1 / 1; }\n    .ph-img.portrait  { aspect-ratio: 3 / 4; }\n    .ph-img.wide      { aspect-ratio: 16 / 9; }\n    .content-img {\n      display: block;\n      max-width: 100%;\n      max-height: min(70vh, 720px);\n      width: auto;\n      height: auto;\n      object-fit: contain;\n      justify-self: center;\n      border-radius: var(--radius-lg);\n    }\n\n    /* ─── divider ───────────────────────────────────────────────────── */\n    .rule  { border: 0; border-top: 1px solid var(--border); margin: 0; }\n    .rule-strong { border: 0; border-top: 1px solid var(--fg); margin: 0; }\n\n    /* ─── hero variants used by layouts.md ──────────────────────────── */\n    .hero          { padding-block: clamp(80px, 12vw, 160px); }\n    .hero-center   { text-align: center; max-width: 32ch; margin-inline: auto; }\n    .hero h1       { margin-bottom: var(--gap-md); }\n    .hero .lead    { margin-bottom: var(--gap-lg); }\n    .hero-cta      { display: inline-flex; gap: var(--gap-sm); flex-wrap: wrap; }\n    .hero-center .hero-cta { justify-content: center; }\n    .hero-split    { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-2xl); align-items: center; }\n    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }\n\n    /* ─── log row (newsletter, blog list, changelog) ────────────────── */\n    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; gap: var(--gap-lg); padding: 22px 0; border-top: 1px solid var(--border); align-items: baseline; }\n    .log-row .meta { color: var(--muted); }\n    .log-row h3 { font-size: 19px; }\n    .log-row .pull { text-align: right; }\n  \n@font-face{font-family:\"Plus Jakarta Sans\";src:url(data:font/woff2;base64,d09GMgABAAAAAGrUABQAAAAA7vwAAGpeAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGoMxG8gwHIgyP0hWQVKHLz9NVkFSRgZgP1NUQVSBHACFNC9cEQgKgYxI7lYLhDwAMIHLEAE2AiQDiHQEIAWGXAeKIQwHG3PcNaoT5UJ2rjvBFbXb1zrCyICwcZDhsTEZibBTnFVS2f//PUGNMeRZOxBMy80nwssIL4KRVlVWPVvuKhLWyDHqzqzt9i3jsf0imSFDA83Xui3bPfnMmSlI4ra1RWYWA5CO0JIgbL6GrFlWgrQtAUMewx/GbmdZhDMtwyvcUyGwCAQQBKSCx4kzvZdsN vertisement differs.</p></div></div><div class=\"journey\" aria-label=\"Verification stages\"><span id=\"stage-record\"><b>01</b> Establish the record</span><span id=\"stage-edit\"><b>02</b> Review the advertisement</span><span id=\"stage-findings\"><b>03</b> Inspect the differences</span></div></section>\n<form id=\"lookup\" class=\"reference-bar\" data-od-id=\"reference-lookup\" novalidate><div class=\"field\"><label for=\"reference\">Listing reference</label><input class=\"input num\" id=\"reference\" value=\"\" autocomplete=\"off\" aria-describedby=\"lookup-feedback\" data-od-id=\"reference\"></div><button class=\"btn btn-secondary\" type=\"submit\" data-od-id=\"v11-control-6\">Check reference</button><button class=\"btn btn-ghost\" type=\"button\" id=\"new-check\" data-od-id=\"new-check\">Start a new check ↗</button></form>\n<div id=\"reference-summary\" class=\"reference-summary\" hidden><div><span class=\"kicker\">Listing reference</span><code id=\"reference-code\"></code></div><div class=\"summary-actions\"><button id=\"recheck\" class=\"btn btn-ghost\" data-od-id=\"recheck\">Recheck reference</button><button id=\"change-reference\" class=\"btn btn-secondary\" data-od-id=\"change-reference\">Change reference</button></div><button class=\"btn btn-primary record-jump\" id=\"compare-advertisement\" type=\"button\">Compare an advertisement <span aria-hidden=\"true\">↓</span></button></div><div id=\"lookup-feedback\" class=\"feedback\" role=\"status\" aria-live=\"polite\"></div>\n<div id=\"empty\" class=\"empty\"><h2 id=\"empty-title\" tabindex=\"-1\" data-od-id=\"empty-title\">Start with a listing reference.</h2><p id=\"empty-copy\">Enter the reference shared with the advertisement, or explore the example below.</p><button class=\"btn btn-secondary\" id=\"open-example\" data-od-id=\"open-example\">Open sample listing</button></div>\n<div id=\"workspace\" class=\"workspace\" hidden>\n<section class=\"record-wrap\" data-od-id=\"listing-record\"><div class=\"record\"><div class=\"record-top\"><p class=\"kicker\">Listing record</p><h2 data-od-id=\"v11-control-12\">Bayu Meranti Residences</h2><p>Petaling Jaya, Selangor · Block B · Unit 12-08</p></div><div class=\"record-body\"><p class=\"example-note\">DEMO · Synthetic property, identities and issuer authority. Comparisons run locally.</p><span class=\"status current\">▣ CURRENT — sample record</span><dl><div><dt>Approved monthly rent</dt><dd class=\"rent\">RM1,850<small> / month</small></dd></div><div><dt>Approved contact</dt><dd>Nadia Rahman</dd></div></dl><p class=\"record-validity\"><strong>Valid 01–31 Oct 2026 · MYT</strong><span>00:00 on 1 Oct to 23:59 on 31 Oct</span></p><div class=\"notice unknown\"><strong>? Payment recipient NOT VERIFIED</strong>No bank-account control check has run.</div><p class=\"record-status-caption\" style=\"margin-top:16px\">A current record does not prove legal ownership or advertiser identity.</p><details id=\"record-details\" open><summary>Issuer, version & provenance</summary><div class=\"meta-pair\"><p>Issuer<strong>Bayu Meranti Property Management</strong></p><p>Record version<strong>01</strong></p><p>Validity begins<strong>01 Oct 2026, 00:00 MYT</strong></p><p>Validity ends<strong>31 Oct 2026, 23:59 MYT</strong></p></div><p><strong>Authorised representative:</strong> Nadia Rahman</p><p>Covered fields: property, unit, monthly rent, representative and contact. No live signature, issuer-authority or status check has run. Checked-at time: not supplied.</p><p>A current record does not establish legal ownership or authenticate the advertiser. The example issuer and authority decision are illustrative.</p></details></div></div></section>\n<section class=\"task\" data-od-id=\"termsguard-workspace\"><div id=\"review-heading\" class=\"task-title\"><span class=\"step-index\">02</span><div><h2 data-od-id=\"v11-control-13\">Bring the other story.</h2><p>Paste the message you received. Then review its claims.</p></div></div>\n<div class=\"editor\" id=\"editor\"><div class=\"field\"><label for=\"message\">Original advertisement</label><textarea class=\"textarea\" id=\"message\" aria-describedby=\"extract-feedback\" placeholder=\"Paste the original rental advertisement here…\" data-od-id=\"message\"></textarea></div><div class=\"editor-actions\"><button class=\"btn btn-ghost\" id=\"sample\" data-od-id=\"sample\">Use sample message ↗</button><button class=\"btn btn-secondary\" id=\"extract\" data-od-id=\"extract\">Extract candidate details</button></div><p class=\"help\" id=\"extract-feedback\" role=\"status\">Extract candidate details using text rules, or enter them manually below.</p><div class=\"candidates\"><div class=\"candidate-heading\"><span class=\"kicker\">Review the details</span><h3 data-od-id=\"v11-control-17\">Review the details.</h3></div><p class=\"help\">Editable values from the outside message—not verified facts.</p><div class=\"candidate-grid\"><div class=\"field\"><label for=\"rent\">Monthly rent (RM)</label><input class=\"input\" id=\"rent\" inputmode=\"decimal\" placeholder=\"e.g. 1700\" data-od-id=\"rent\"></div><div class=\"field\"><label for=\"contact\">Contact</label><input class=\"input\" id=\"contact\" placeholder=\"As advertised\" data-od-id=\"contact\"></div><div class=\"field\"><label for=\"payee\">Payment recipient</label><input class=\"input\" id=\"payee\" placeholder=\"If mentioned\" data-od-id=\"payee\"></div></div></div><div class=\"actions\"><p id=\"edit-feedback\" class=\"help\" role=\"status\">Review all three details.</p><button class=\"btn btn-primary\" id=\"compare\" data-od-id=\"compare\">Compare with record →</button></div></div>\n<section id=\"results\" class=\"results\" data-od-id=\"comparison-results\" hidden aria-labelledby=\"results-title\"><div class=\"results-head\"><button class=\"btn btn-ghost\" id=\"edit-claims\" data-od-id=\"edit-claims\">← Edit advertisement & claims</button><p class=\"kicker\">Comparison</p><h2 id=\"results-title\" tabindex=\"-1\" data-od-id=\"results-title\">The difference is in the details.</h2><p id=\"result-summary\" role=\"status\"></p></div><div id=\"finding-nav\" class=\"finding-nav\" role=\"group\" aria-label=\"Inspect a finding\"></div><div id=\"findings\"></div><div class=\"next\"><h3 data-od-id=\"v11-control-24\">A clearer next conversation.</h3><p id=\"next-copy\">Confirm the rent and contact through a trusted route obtained independently of this advertisement. Ask the approved representative to clarify the proposed payment recipient.</p><p>Differences do not prove fraud. Matching details do not make a transaction safe.</p><button class=\"btn btn-secondary\" id=\"copy\" data-od-id=\"copy\">Copy questions for Nadia Rahman</button><p id=\"copy-feedback\" role=\"status\"></p><textarea class=\"textarea\" id=\"copy-fallback\" readonly hidden aria-label=\"Questions to select and copy\" data-od-id=\"copy-fallback\"></textarea></div></section>\n</section></div></main>\n<footer class=\"pagefoot\" data-od-id=\"footer\"><div class=\"container\"><strong>SafeListing</strong><p>Independent rental-listing checks. No affiliation with or endorsement by Sime Darby Property is implied.</p></div></footer>\n<script>\nconst $=id=>document.getElementById(id);\nconst narrowRecord=matchMedia('(max-width:639px)');\nfunction adaptRecord(){ $('record-details').open=!narrowRecord.matches; }\nadaptRecord();narrowRecord.addEventListener('change',adaptRecord);\n$('compare-advertisement').onclick=()=>{if($('editor').hidden){$('results-title').focus({preventScroll:true});$('results-title').scrollIntoView({block:'start',behavior:'instant'});}else{$('message').focus({preventScroll:true});$('review-heading').scrollIntoView({block:'start',behavior:'instant'});}};\n\nconst sample=\"Bayu Meranti Residences, Block B, Unit 12-08 is available for rent. RM1,700 per month. Contact Daniel Lim to arrange a viewing. Booking deposit required to secure the unit. Transfer to the account provided before collecting keys.\";\nlet active=false, 'Extract candidate details';}};\n$('message').oninput=()=>{clearCandidates();$('extract-feedback').textContent='Message changed. Extract fresh candidates or enter them manually.';};['rent','contact','payee'].forEach(id=>$(id).oninput=invalidate);\nfunction finding(label,value,record,state,reason){const d=document.createElement('article');d.className='finding';d.open=true;d.dataset.state=state==='MATCH'?'match':state==='CONTRADICTION'?'contradiction':'unknown';d.dataset.odId='finding-'+label.toLowerCase().replaceAll(' ','-');const sum=document.createElement('header');sum.className='finding-heading';const name=document.createElement('span');name.textContent=label;const badge=document.createElement('span');badge.className='status '+state.toLowerCase().replace('not verified','unknown');badge.textContent=state==='CONTRADICTION'?'⇄ '+state:state==='MATCH'?'✓ '+state:'? '+state;sum.append(name,badge);const pair=document.createElement('div');pair.className='pair';[['Outside claim',value||'Not supplied'],[label==='Payment recipient'?'Record coverage':'Issuer-authorised value',record]].forEach(([source,val],i)=>{if(i){const line=document.createElement('span');line.className='connector';line.setAttribute('aria-hidden','true');line.innerHTML=state==='MATCH'?'<svg viewBox=\"0 0 56 96\" fill=\"none\"><path d=\"M28 0v96\" stroke=\"currentColor\" opacity=\".2\"/><path d=\"M0 48h56\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"14\" cy=\"48\" r=\"3.5\" fill=\"currentColor\"/><circle cx=\"42\" cy=\"48\" r=\"3.5\" fill=\"currentColor\"/></svg>':state==='CONTRADICTION'?'<svg viewBox=\"0 0 56 96\" fill=\"none\"><path d=\"M28 0v96\" stroke=\"currentColor\" opacity=\".22\"/><path d=\"M0 28h12l32 40h12\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"12\" cy=\"28\" r=\"3.5\" fill=\"currentColor\"/><circle cx=\"44\" cy=\"68\" r=\"3.5\" fill=\"currentColor\"/></svg>':'<svg viewBox=\"0 0 56 96\" fill=\"none\"><path d=\"M28 0v96\" stroke=\"currentColor\" opacity=\".2\"/><path d=\"M0 48h16M40 48h16\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><circle cx=\"28\" cy=\"48\" r=\"7\" stroke=\"currentColor\" stroke-width=\"1.8\"/></svg>';pair.append(line);}const box=document.createElement('div');box.className='value';const small=document.createElement('small');small.textContent=source;const strong=document.createElement('strong');strong.textContent=val;box.append(small,strong);pair.append(box);});const p=document.createElement('p');p.className='reason';p.textContent=reason;d.append(sum,pair,p);return d;}\n$('compare').onclick=()=>{if(!active)return;const r=$('rent').value.trim(),c=$('contact').value.trim(),p=$('payee').value.trim();const valid=/^\\d+(?:\\.\\d{1,2})?$/.test(r)&&Number(r)>0;const rs=!valid?'NOT VERIFIED':Number(r)===1850?'MATCH':'CONTRADICTION';const cs=!c?'NOT VERIFIED':c.toLocaleLowerCase() === 'nadia rahman'?'MATCH':'CONTRADICTION';$('findings').replaceChildren(finding('Monthly rent',r?(valid?'RM'+Number(r).toLocaleString('en-MY')+' / month':r):'','RM1,850 / month',rs,rs==='MATCH'?'This candidate agrees with the example record’s monthly rent.':rs==='NOT VERIFIED'?'A clear monthly amount is missing. Review the message and correct the candidate.':'The candidate amount differs from the record by RM'+Math.abs(Number(r)-1850).toLocaleString('en-MY')+' per month. Confirm the advertised terms independently.'),finding('Contact',c,'Nadia Rahman',cs,cs==='MATCH'?'This candidate agrees with the covered contact label. It does not authenticate the sender.':cs==='NOT VERIFIED'?'No contact candidate was supplied. Ask for the approved contact.':'The outside contact is different from the approved contact. Confirm who is authorised through an independent route.'),finding('Payment recipient',p,'No independently verified bank recipient','NOT VERIFIED','No bank-account or recipient-control check is available. Confirm the proposed recipient independently, even if every other detail matches.'));const count=[rs,cs].filter(s=>s==='CONTRADICTION').length;$('result-summary').textContent=(count?(count===2?'Two details contradict the record. ':'One detail contradicts the record. '):'No contradictions established in the supplied covered details. ')+'Payment recipient remains NOT VERIFIED.';$('results').hidden=false;$('edit-feedback').textContent='Comparison updated from your reviewed candidates.';$('editor').hidden=true;$('review-heading').hidden=true;setStage('findings');mountFindingNav();$('results-title').focus({preventScroll:true});$('results-title').scrollIntoView({block:'start',behavior:'instant'});};\nfunction hideRecord(){active=false;$('workspace').hidden=true;$('empty').hidden=false;invalidate();}\nfunction showExample(){active=true;$('reference').value='SL-2026-PJ-1208';$('reference').removeAttribute('aria-invalid');$('workspace').hidden=false;$('empty').hidden=true;$('lookup-feedback').textContent='';$('message').value='';clearCandidates();$('edit-feedback').textContent='Add a message or enter candidate details.';$('extract-feedback').textContent='Text rules extract candidates. Review them before comparing.';$('lookup').hidden=true;$('reference-summary').hidden=false;$('reference-code').textContent='SL-2026-PJ-1208';setStage('edit');}\n$('open-example').onclick=()=>{ $('reference').value='SL-2026-PJ-1208';lookupReference(); };\nfunction resetCheck(){revision++;$('lookup').removeAttribute('aria-busy');hideRecord();$('reference').value='';$('message').value='';clearCandidates();$('lookup').hidden=false;$('reference-summary').hidden=true;$('lookup-feedback').textContent='';$('empty-title').textContent='Start with a listing reference.';$('empty-copy').textContent='Enter the reference from the listing, or explore a clearly labelled example.';$('reference').focus();}\n$('new-check').onclick=()=>SLNavigate('/?section=reference-form');$('change-reference').onclick=resetCheck;$('recheck').onclick=lookupReference;\n$('reference').oninput=()=>{revision++;$('lookup').removeAttribute( erdict=state==='match'?'MATCH':state==='contradiction'?'CONTRADICTION':'NOT VERIFIED';const b=document.createElement('button');b.dataset.state=state;b.dataset.odId='inspect-'+i;b.setAttribute('aria-label',label+': '+verdict);const title=document.createElement('span');title.textContent=label;const status=document.createElement('small');status.textContent=verdict;b.append(title,status);b.onclick=()=>selectFinding(i);$('finding-nav').append(b);});selectFinding(0);}\nfunction selectFinding(index){selectedFinding=index;[...$('finding-nav').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));[...$('findings').children].forEach((d,i)=>{d.dataset.selected=String(i===index);d.open=true;});}\n$('edit-claims').onclick=()=>{invalidate();$('message').focus();};\n$('copy').onclick=async()=>{const text='For Bayu Meranti Residences, Block B, Unit 12-08: Please confirm the approved monthly rent of RM1,850 and explain the advertised amount '+($('rent').value||'(not supplied)')+'. Is '+($('contact').value||'the advertised contact')+' authorised? Who controls the proposed recipient '+($('payee').value||'(not supplied)')+', and how can I confirm this independently?';try{await navigator.clipboard.writeText(text);$('copy-feedback').textContent='Questions copied.';}catch{$('copy-fallback').hidden=false;$('copy-fallback').value=text;$('copy-fallback').focus();$('copy-fallback').select();$('copy-feedback').textContent='Clipboard unavailable. Select and copy the questions below.';}};\nconst params=window.SLParams;let incoming=window.__SLRoute?.reference||params.get('reference');if(!incoming){try{incoming=decodeURIComponent(location.hash.slice(1));}catch{incoming='';}}if(!incoming&&location.pathname.includes('/verify/')){try{incoming=decodeURIComponent(location.pathname.split('/verify/')[1]);}catch{incoming='';}}\nhideRecord();$('lookup').hidden=false;$('reference-summary').hidden=true;if(incoming){$('reference').value=incoming;lookupReference();}\ndocument.querySelector s({preventScroll:true});}\ntoggle.onclick=()=>{previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';menu.showModal();toggle.setAttribute('aria-expanded','true');close.focus({preventScroll:true});};close.onclick=()=>shut();menu.addEventListener('cancel',e=>{e.preventDefault();shut();});menu.addEventListener('click',e=>{if(e.target===menu){const r=menu.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)shut();}});matchMedia('(min-width:901px)').addEventListener('change',e=>{if(e.matches)shut(false);});\ndocument.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const href=a.getAttribute('href');if(href.includes('safelisting-application.html#')){e.preventDefault();shut(false);SLNavigate(href.split('safelisting-application.html#')[1]);}else if(href.startsWith('#')){const el=document.getElementById(href.slice(1));if(el){e.preventDefault();shut(false);window.scrollTo({top:window.scrollY+el.getBoundingClientRect().top-24,behavior:'instant'});(el.querySelector('input')||el).focus({preventScroll:true});}}});\nwindow.SLScrollTo=section=>{const el=document.getElementById(section);if(el){window.scrollTo({top:scrollY+el.getBoundingClientRect().top-24,behavior:'instant'});const focus=el.querySelector('input')||el;focus.setAttribute('tabindex',focus.matches('input')?'0':'-1');focus.focus({preventScroll:true});}};\nif(window.__SLRoute?.section)requestAnimationFrame(()=>SLScrollTo(window.__SLRoute.section));\nif(window.__SLRoute?.menu)requestAnimationFrame(()=>toggle.click());\nwindow.addEventListener('message',event=>{if(event.source!==parent)return;const data=event.data;if(data?.type==='safelisting:scroll'&&typeof data.section==='string')SLScrollTo(data.section);});\nwindow.SLReady=true;parent.postMessage({type:'safelisting-ready',page:window.__SLRoute?.page||document.body.dataset.page},'*');\n})();<\/script></body></html>", "issuer": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>SafeListing — Issuer Workspace · Integrated Experience</title><style>\n    /* ─── tokens ─────────────────────────────────────────────────────────\n       Six variables. Bind them to the active DESIGN.md and stop.\n       Do not introduce raw hex anywhere else in this file. */\n    :root {--bg:#FFF9F6;--surface:#FFFFFF;--fg:#1F2326;--muted:#535D68;--border:#D9DEE5;--accent:#D71920;--hover:rgb(181 21 28);--control:rgb(122 130 142);--soft:rgb(244 245 247);--gold:#FCAF17;--blue:rgb(23 92 211);--blue-bg:rgb(239 245 255);--green:rgb(6 118 71);--green-bg:rgb(236 253 243);--violet:rgb(105 65 198);--violet-bg:rgb(244 240 255);--ochre:rgb(133 77 14);--ochre-bg:rgb(255 250 235);--critical:rgb(159 18 57);--critical-bg:rgb(255 241 243);--info:rgb(23 85 105);--info-bg:rgb(238 248 252);--neutral:rgb(71 84 103);--neutral-bg:rgb(242 244 247);--font-display:\"Plus Jakarta Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;--font-body:var(--font-display);--font-mono:ui-monospace,Consolas,monospace;--fs-body:1rem;--fs-meta:.875rem;--fs-h1:2.5rem;--fs-h2:1.5rem;--fs-h3:1.25rem;--fs-lead:1rem;--gap-xs:8px;--gap-sm:12px;--gap-md:20px;--gap-lg:32px;--gap-xl:48px;--gap-2xl:64px;--container:1264px;--gutter:32px;--radius:8px;--radius-lg:12px;--accent-soft:color-mix(in oklch,var(--accent) 8%,var(--surface));--fg-soft:var(--soft);}\n\n    /* ─── reset & base ──────────────────────────────────────────────── */\n    *, *::before, *::after { box-sizing: border-box; }\n    html { -webkit-text-size-adjust: 100%; }\n    body {\n      margin: 0;\n      background: var(--bg);\n      color: var(--fg);\n      font-family: var(--font-body);\n      font-size: var(--fs-body);\n      line-height: 1.55;\n      text-rendering: optimizeLegibility;\n      -webkit-font-smoothing: antialiased;\n    }\n    img, svg { display: block; max-width: 100%; }\n    a { color: inherit; text-decoration: none; }\n    button { font: inherit; cursor: pointer; }\n    p { text-wrap: pretty; }\n    h1, h2, h3, h4 { text-wrap: balance; }\n\n    /* ─── layout primitives ─────────────────────────────────────────── */\n    .container {\n      max-width: var(--container);\n      margin-inline: auto;\n      padding-inline: var(--gutter);\n    }\n    .section {\n      padding-block: clamp(48px, 8vw, var(--gap-2xl));\n    }\n    .section + .section { border-top: 1px solid var(--border); }\n    .stack { display: flex; flex-direction: column; }\n    .stack > * + * { margin-top: var(--gap-md); }\n    .row { display: flex; align-items: center; gap: var(--gap-md); }\n    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }\n    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }\n    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }\n    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }\n    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }\n    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }\n    @media (max-width: 920px) {\n      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }\n    }\n\n    /* ─── type ──────────────────────────────────────────────────────── */\n    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }\n    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }\n    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }\n    .lead   { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }\n    .eyebrow {\n      font-family: var(--font-mono);\n      font-size: 12px;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      color: var(--accent);\n      margin: 0 0 var(--gap-md);\n    }\n    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }\n    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n\n    /* ─── chrome: nav + footer ──────────────────────────────────────── */\n    .topnav {\n      position: sticky; top: 0; z-index: 10;\n      background: color-mix(in oklch, var(--bg) 92%, transparent);\n      backdrop-filter: blur(12px);\n      border-bottom: 1px solid var(--border);\n    }\n    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }\n    .topnav .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }\n    .topnav nav { display: flex; gap: var(--gap-lg); }\n    .topnav nav a { font-size: 14px; color: var(--muted); }\n    .topnav nav a:hover { color: var(--fg); }\n    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }\n    .pagefoot .row-between { flex-wrap: wrap; gap: var(--gap-md); }\n\n    /* ─── buttons ───────────────────────────────────────────────────── */\n    .btn {\n      display: inline-flex; align-items: center; gap: 8px;\n      padding: 11px 20px;\n      border-radius: var(--radius);\n      border: 1px solid transparent;\n      font-size: 15px;\n      font-weight: 500;\n      letter-spacing: -0.005em;\n      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;\n    }\n    .btn:active { transform: translateY(1px); }\n    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }\n    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }\n    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }\n    .btn-secondary:hover { border-color: var(--fg); }\n    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 8px; }\n    .btn-ghost:hover { color: var(--accent); }\n    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }\n    .btn-arrow:hover::after { transform: translateX(2px); }\n\n    /* ─── card / surface ────────────────────────────────────────────── */\n    .card {\n      background: var(--surface);\n      border: 1px solid var(--border);\n      border-radius: var(--radius-lg);\n      padding: 28px;\n    }\n    .card-flat { background: transparent; border: 0; padding: 0; }\n    .card-rule { background: transparent; border: 0; border-top: 1px solid var(--fg); padding: 24px 0 0; border-radius: 0; }\n\n    /* ─── feature cell (icon + h3 + p) ──────────────────────────────── */\n    .feature .feature-mark {\n      width: 36px; height: 36px;\n      display: grid; place-items: center;\n      border: 1px solid var(--border);\n      border-radius: 10px;\n      color: var(--accent);\n      margin-bottom: var(--gap-md);\n    }\n    .feature .feature-mark svg { width: 18px; height: 18px; }\n    .feature h3 { margin-bottom: 6px; }\n    .feature p  { margin: 0; color: var(--muted); font-size: 15px; }\n\n    /* ─── stat (big number + label) ─────────────────────────────────── */\n    .stat .stat-num {\n      font-family: var(--font-display);\n      font-size: clamp(56px, 8vw, 96px);\n      line-height: 0.95;\n      letter-spacing: -0.04em;\n      color: var(--accent);\n      font-weight: 600;\n    }\n    .stat .stat-label { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 24ch; }\n    .stat .stat-unit  { font-size: 0.5em; opacity: 0.7; margin-left: 2px; }\n\n    /* ─── quote / testimonial ───────────────────────────────────────── */\n    .quote {\n      font-family: var(--font-display);\n      font-size: clamp(24px, 2.6vw, 32px);\n      line-height: 1.32;\n      letter-spacing: -0.01em;\n      max-width: 28ch;\n    }\n    .quote-author { color: var(--muted); font-size: 14px; margin-top: var(--gap-md); }\n    .quote-mark   {\n      font-family: var(--font-display);\n      font-size: 140px; line-height: 0.7;\n      color: var(--accent); opacity: 0.18;\n      margin-bottom: -28px;\n    }\n\n    /* ─── pill / badge / tag ────────────────────────────────────────── */\n    .pill {\n      display: inline-flex; align-items: center; gap: 6px;\n      padding: 4px 10px;\n      background: var(--accent-soft);\n      color: var(--accent);\n      border-radius: 999px;\n      font-family: var(--font-mono);\n      font-size: 11px;\n      letter-spacing: 0.04em;\n      text-transform: uppercase;\n    }\n    .tag {\n      display: inline-flex; align-items: center;\n      padding: 4px 10px;\n      background: transparent;\n      color: var(--muted);\n      border: 1px solid var(--border);\n      border-radius: 999px;\n      font-size: 12px;\n    }\n\n    /* ─── form field ────────────────────────────────────────────────── */\n    .field { display: flex; flex-direction: column; gap: 6px; }\n    .field label { font-size: 13px; color: var(--muted); }\n    .input, .textarea {\n      width: 100%;\n      padding: 11px 14px;\n      border: 1px solid var(--border);\n      border-radius: var(--radius);\n      background: var(--surface);\n      color: var(--fg);\n      font: inherit;\n      font-size: 15px;\n    }\n    .input:focus, .textarea:focus {\n      outline: 2px solid var(--accent-soft);\n      border-color: var(--accent);\n    }\n    .textarea { min-height: 96px; resize: vertical; line-height: 1.55; }\n\n    /* ─── table (data-style, no chrome) ─────────────────────────────── */\n    .ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }\n    .ds-table th, .ds-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }\n    .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }\n    .ds-table tbody tr:hover { background: var(--fg-soft); }\n    .ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }\n\n    /* ─── image placeholder (DS-tinted block, never broken <img>) ──── */\n    .ph-img {\n      background:\n        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),\n        var(--surface);\n      border: 1px solid var(--border);\n      border-radius: var(--radius-lg);\n      aspect-ratio: 16 / 10;\n      display: grid; place-items: center;\n      color: var(--muted);\n      font-family: var(--font-mono);\n      font-size: 12px;\n      letter-spacing: 0.04em;\n    }\n    .ph-img.square    { aspect-ratio: 1 / 1; }\n    .ph-img.portrait  { aspect-ratio: 3 / 4; }\n    .ph-img.wide      { aspect-ratio: 16 / 9; }\n    .content-img {\n      display: block;\n      max-width: 100%;\n      max-height: min(70vh, 720px);\n      width: auto;\n      height: auto;\n      object-fit: contain;\n      justify-self: center;\n      border-radius: var(--radius-lg);\n    }\n\n    /* ─── divider ───────────────────────────────────────────────────── */\n    .rule  { border: 0; border-top: 1px solid var(--border); margin: 0; }\n    .rule-strong { border: 0; border-top: 1px solid var(--fg); margin: 0; }\n\n    /* ─── hero variants used by layouts.md ──────────────────────────── */\n    .hero          { padding-block: clamp(80px, 12vw, 160px); }\n    .hero-center   { text-align: center; max-width: 32ch; margin-inline: auto; }\n    .hero h1       { margin-bottom: var(--gap-md); }\n    .hero .lead    { margin-bottom: var(--gap-lg); }\n    .hero-cta      { display: inline-flex; gap: var(--gap-sm); flex-wrap: wrap; }\n    .hero-center .hero-cta { justify-content: center; }\n    .hero-split    { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-2xl); align-items: center; }\n    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }\n\n    /* ─── log row (ne f=\"safelisting-application.html#/?section=how-it-works\" data-od-id=\"mobile-nav-how\">How it works</a></nav><div class=\"sl-mobile-action\"><a class=\"sl-action\" href=\"safelisting-application.html#/?section=reference-form\" data-od-id=\"mobile-check\">New check<span aria-hidden=\"true\">↗</span></a></div></dialog>\n<div class=\"operator\" style=\"max-width:1200px;margin:16px auto;padding:0 32px;font-size:.875rem;text-align:left\" data-od-id=\"issuer-operator-context\"></div><main id=\"content\" class=\"container\"><section class=\"intro\" data-od-id=\"intro\"><div class=\"row-between\"><div><h1 data-od-id=\"issuer-element-5\">Every listing.<br><span>Accounted for.</span></h1><p class=\"sub\">Keep every listing’s details and history in one place.</p></div><button class=\"btn btn-primary\" id=\"new-listing\" data-od-id=\"new-listing\">Prepare authorisation <span aria-hidden=\"true\">↗</span></button></div></section>\n<div class=\"example-banner\"><strong>Illustrative workspace</strong><span>Bayu Meranti Property Management / Issuer role</span></div>\n<div class=\"issuer-view-control\"><label for=\"issuer-view\">Workspace view</label><select id=\"issuer-view\"><option value=\"overview\">Overview</option><option value=\"create\">Create listing</option><option value=\"authority\">Authority review</option><option value=\"details\">Record details</option><option value=\"manage\">Revoke / update</option></select></div><nav class=\"workspace-nav\" aria-label=\"Issuer views\"><button data-view=\"overview\" aria-current=\"page\" data-od-id=\"issuer-element-7\"><span>01</span>Overview</button><button data-view=\"create\" data-od-id=\"issuer-element-8\"><span>02</span>Create listing</button><button data-view=\"authority\" data-od-id=\"issuer-element-9\"><span>03</span>Authority review</button><button data-view=\"details\" data-od-id=\"issuer-element-10\"><span>04</span>Record details</button><button data-view=\"manage\" data-od-id=\"issuer-element-11\"><span>05</span>Revoke / update</button></nav>\n<div id=\"workspace\">\n<section id=\"overview\" class=\"view\" data-od-id=\"overview\"><div class=\"split\"><div><div class=\"section-title\"><div><h2 data-od-id=\"issuer-element-12\">The authorisation ledger</h2><p>Published records and the work that comes next.</p></div></div><div class=\"filterbar\"><div class=\"field\"><label class=\"sr-only\" for=\"search\">Search property, reference or representative</label><input class=\"input\" id=\"search\" placeholder=\"Search property, reference or representative\" data-od-id=\"search\"></div><div class=\"field\"><label class=\"sr-only\" for=\"filter\">Filter records</label><select id=\"filter\" data-od-id=\"filter\"><option value=\"all\">All records</option><option value=\"current\">Current</option><option value=\"expired\">Expired</option><option value=\"pending\">Pending review</option></select></div></div><div class=\"priority\"><div><p class=\"kicker\">Awaiting authority review</p><strong>November is a separate authority request.</strong><p>It does not inherit October’s approval. No record has been issued.</p></div><button class=\"btn btn-ghost\" id=\"priority-review\" data-od-id=\"priority-review\">Inspect request →</button></div><div id=\"ledger\" class=\"ledger\"></div><p class=\"quiet-note\">Records retain their published terms. Changes create a new reviewed statement—not a silent edit.</p></div><aside id=\"overview-preview\" aria-label=\"Selected record preview\"></aside></div></section>\n<section id=\"create\" class=\"view\" data-od-id=\"create\" hidden><div class=\"split\"><div><div class=\"section-title\"><div><p class=\"kicker\">Create a listing</p><h2 data-od-id=\"issuer-element-16\">Define exactly what is authorised.</h2><p>These are the details renters will compare against.</p></div></div><form id=\"create-form\" novalidate><div class=\"form-section\"><h3 data-od-id=\"issuer-element-17\">01 / Property & scope</h3><div class=\"form-grid\"><div class=\"field\"><label for=\"property\">Property</label><input id=\"property\" class=\"input\" required value=\"Bayu Meranti Residences\" data-od-id=\"property\"></div><div class=\"field\"><label for=\"unit\">Block and unit</label><input id=\"unit\" class=\"input\" required value=\"Block B, Unit 12-08\" data-od-id=\"unit\"></div><div class=\"field full\"><label for=\"property-id\">Property identifier</label><input id=\"property-id\" class=\"input\" required value=\"BM-B-1208\" data-od-id=\"property-id\"><small>Example scope is limited to this unit's residential letting.</small></div></div></div><div class=\"form-section\"><h3 data-od-id=\"issuer-element-21\">02 / Approved listing terms</h3><div class=\"form-grid\"><div class=\"field\"><label for=\"representative\">Authorised representative</label><input id=\"representative\" class=\"input\" required value=\"Nadia Rahman\" data-od-id=\"representative\"></div><div class=\"field\"><label for=\"contact\">Approved contact</label><input id=\"contact\" class=\"input\" required value=\"Nadia Rahman\" data-od-id=\"contact\"></div><div class=\"field full\"><label for=\"rent\">Monthly rent (RM)</label><input id=\"rent\" aria-describedby=\"create-feedback\" class=\"input\" inputmode=\"decimal\" required value=\"1850\" data-od-id=\"rent\"></div><div class=\"field\"><label for=\"valid-from\">Valid from (MYT)</label><input id=\"valid-from\" class=\"input\" type=\"date\" required value=\"2026-10-01\" data-od-id=\"valid-from\"></div><div class=\"field\"><label for=\"valid-to\">Expires (MYT)</label><input id=\"valid-to\" class=\"input\" type=\"date\" required value=\"2026-10-31\" data-od-id=\"valid-to\"></div></div></div><div class=\"notice info\"><strong>Issuer: Bayu Meranti Property Management</strong>Proposed scope: residential letting of the identified unit. Eligibility must be re-established before signing.</div><div id=\"create-feedback\" class=\"feedback\" role=\"status\"></div><div class=\"actions\"><button type=\"button\" id=\"save-draft\" class=\"btn btn-secondary\" data-od-id=\"save-draft\">Keep draft in this session</button><button class=\"btn btn-primary\" type=\"submit\" data-od-id=\"issuer-element-28\">Review issuing eligibility →</button></div></form></div><aside><p class=\"kicker\">Unpublished preview</p><div id=\"draft-preview\"></div></aside></div></section>\n<section id=\"authority\" class=\"view\" data-od-id=\"authority\" hidden><div class=\"split\"><div><div class=\"section-title\"><div><p class=\"kicker\">Review authority</p><h2 data-od-id=\"issuer-element-29\">Authority, with a defined boundary.</h2><p>Separate what is requested from what has been reviewed.</p></div></div><div class=\"review-block\"><p class=\"kicker\">Proposed authority</p><h3 data-od-id=\"issuer-element-30\">Bayu Meranti Residences · Block B, Unit 12-08</h3><dl class=\"scope-lines\"><div><dt>Applicant</dt><dd>Bayu Meranti Property Management</dd></div><div><dt>Proposed scope</dt><dd data-scope-period>Residential letting · one unit · October 2026</dd></div><div><dt>Representative</dt><dd>Nadia Rahman</dd></div></dl></div><div class=\"review-block\"><p class=\"kicker\">Reviewed authority</p><div id=\"review-decision\"></div></div><div class=\"review-block\"><p class=\"kicker\">Issuing permission</p><h3 id=\"permission-title\" data-od-id=\"permission-title\">Example scope eligible. Live permission not established.</h3><p class=\"quiet-note\">An issuer cannot approve their own authority. Server-side role, scope and current review checks must all pass before issuance.</p><div id=\"reviewer-actions\" hidden><button class=\"btn btn-secondary\" id=\"review-decision-button\" data-od-id=\"review-decision-button\">Review proposed decision</button></div></div><div id=\"review-feedback\" class=\"feedback\" role=\"status\"></div></div><aside><div class=\"record\"><div class=\"record-head\"><p class=\"kicker\">Authority trail</p><h2 data-od-id=\"issuer-element-33\">A permission.<br>Not a claim of ownership.</h2><p>Scope-bound. Time-bound. Independently reviewed.</p></div><div class=\"record-main\"><ol class=\"lifecycle\" id=\"authority-trail\"><li><strong>Scope submitted</strong><small>28 Sep 2026 · 09:00 MYT</small><p>Bayu Meranti Property Management requested permission for the unit.</p></li><li><strong>Example reviewer decision</strong><small>30 Sep 2026 · 14:00 MYT</small><p>Sample authority reviewer · Authority reviewer role. October residential letting only.</p></li><li><strong>Permission window</strong><small>01–31 Oct 2026 · MYT</small><p>Changes outside this scope require further review.</p></li></ol><div class=\"notice unknown\"><strong>No real-world legal review established</strong>These decisions are example data. No registry integration or document certification is represented.</div></div></div></aside></div></section>\n<section id=\"details\" class=\"view\" data-od-id=\"record-details\" hidden><div id=\"detail-content\"></div></section>\n<section id=\"manage\" class=\"view\" data-od-id=\"manage\" hidden><div class=\"split\"><div><p class=\"kicker\">Update a record</p><h2 data-od-id=\"issuer-element-34\">A change deserves a new statement.</h2><p class=\"record-selected\" id=\"manage-context\"></p><div class=\"review-block\"><h3 data-od-id=\"issuer-element-35\">Prepare revised terms</h3><p class=\"quiet-note\">Review the difference before preparing a replacement. The existing record stays unchanged.</p><div class=\"change-pair\"><div><span>Published monthly rent</span><strong>RM1,850 / month</strong></div><i aria-hidden=\"true\">→</i><div class=\"field\"><label for=\"update-rent\">Proposed monthly rent (RM)</label><input id=\"update-rent\" class=\"input\" inputmode=\"decimal\" value=\"1850\" data-od-id=\"update-rent\"></div></div><div class=\"change-pair\"><div><span>Published contact</span><strong>Nadia Rahman</strong></div><i aria-hidden=\"true\">→</i><div class=\"field\"><label for=\"update-contact\">Proposed approved contact</label><input id=\"update-contact\" class=\"input\" value=\"Nadia Rahman\" data-od-id=\"update-contact\"></div></div><div class=\"actions\"><button id=\"review-update\" class=\"btn btn-secondary\" data-od-id=\"review-update\">Review proposed changes →</button></div></div><div class=\"review-block\"><h3 data-od-id=\"issuer-element-39\">End this authorisation</h3><p class=\"quiet-note\">Revocation ends current issuer authorisation after server confirmation. It does not erase the signed statement or its history.</p><button class=\"btn btn-secondary\" id=\"open-revoke\" style=\"margin-top:20px\" data-od-id=\"open-revoke\">Review revocation</button><p class=\"quiet-note\" id=\"revoke-eligibility\"></p></div><div id=\"manage-feedback\" class=\"feedback\" role=\"status\"></div></div><aside id=\"manage-preview\"></aside></div></section>\n</div><p id=\"global-feedback\" class=\"feedback\" role=\"status\"></p></main>\n<footer class=\"pagefoot\"><div class=\"container row-between\"><p>SafeListing is independent. A listing record does not establish legal ownership, advertiser identity or payment safety.</p><div class=\"footer-links\"><a href=\"safelisting-application.html#/\" data-od-id=\"issuer-element-41\">Home ↗</a><a href=\"safelisting-application.html#/verify/\" data-od-id=\"issuer-element-42\">Public verifier ↗</a></div></div></footer>\n<dialog id=\"operation-dialog\" aria-labelledby=\"dialog-title\" data-od-id=\"operation-dialog\"><h2 id=\"dialog-title\" data-od-id=\"dialog-title\"></h2><div id=\"dialog-content\"></div><p id=\"dialog-feedback\" role=\"status\"></p><div class=\"actions\"><button id=\"dialog-cancel\" class=\"btn btn-secondary\" autofocus data-od-id=\"dialog-cancel\">Cancel</button><button id=\"dialog-confirm\" class=\"btn btn-primary\" data-od-id=\"dialog-confirm\">Confirm</button></div></dialog>\n<script>\nfunction lifecycleEvents(r){if(r.status==='pending')return [{name:'Scope requested',time:'22 Oct 2026 · MYT',actor:'Bayu Meranti Property Management',reason:'A separate November residential-letting request for Block B, Unit 12-08. It is not a replacement for October’s record.',tone:'neutral'},{name:'Awaiting review',time:'No decision supplied',actor:'Independent reviewer required',reason:'No approved mandate or issuing permission exists for this proposed period. October’s decision does not carry forward.',tone:'unknown'}];return [{name:'Authority reviewed',time:(r.id==='september'?'31 Aug':'30 Sep')+' 2026 · 14:00 MYT',actor:'Sample authority reviewer · Authority reviewer',reason:'Example decision covers residential letting of this unit for the specified period only. No real-world legal review is represented.',tone:'neutral'},{name:'Record issued',time:r.issued,actor:'Bayu Meranti Property Management · Version '+r.version,reason:'Example published statement: RM1,850/month, Nadia Rahman, Nadia Rahman. No actual signature operation is represented.',tone:'neutral'},{name:r.status==='current'?'Current window':'Authorisation expired',time:r.status==='current'?r.period+' · MYT':r.end,actor:r.status==='current'?'Time-bounded issuer scope':'Validity window ended',reason:r.status==='current'?'This example record is current only within its stated scope and period. No live checked-at time is available.':'This statement is no longer current. Request and independently check a new authorisation; its historic terms remain inspectable.',tone:r.status==='current'?'current':'unknown'}];}\nfunction mountLifecycle(id,r){const root=$(id),events=lifecycleEvents(r);root.innerHTML='<div class=\"life-head\"><div><p class=\"kicker\">Record lifecycle / Example events</p><h3>A statement through time.</h3></div><span class=\"life-count\">'+events.length+' stages</span></div><div class=\"event-rail\" role=\"group\" aria-label=\"Lifecycle events\"></div><div class=\"event-inspector\" role=\"status\" aria-live=\"polite\"></div>';const rail=root.querySelector('.event-rail'),inspector=root.querySelector('.event-inspector');events.forEach((event,i)=>{const button=document.createElement('button');button.className='event-node';button.dataset.odId=id+'-event-'+i;button.innerHTML='<span class=\"event-dot\" aria-hidden=\"true\">'+String(i+1).padStart(2,'0')+'</span><strong>'+event.name+'</strong>';button.onclick=()=>select(i);rail.append(button);});function select(index){[...rail.children].forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));const event=events[index];inspector.className='event-inspector '+event.tone;inspector.innerHTML='<p class=\"event-label\">'+event.name+'</p><time>'+event.time+'</time><p class=\"event-actor\">'+event.actor+'</p><p>'+event.reason+'</p>';}select(events.length-1);}\nconst $=id=>document.getElementById(id);\nconst escapeHTML=value=>String(value??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst params=window.SLParams;\nconst role='issuer'; // Local illustrative workspace, not authenticated issuer access.\nconst reviewState=role==='pending'?'pending':params.get('review')||'approved';\nconst records=[{id:'october',ref:'SL-2026-PJ-1208',status:'current',label:'CURRENT',version:'01',period:'01–31 Oct 2026',start:'01 Oct 2026, 00:00 MYT',end:'31 Oct 2026, 23:59 MYT',issued:'01 Oct 2026, 09:00 MYT',summary:'October authorisation',action:'Inspect record'}, {id:'september',ref:'SL-2026-PJ-1208-SEP',status:'expired',label:'EXPIRED',version:'01',period:'01–30 Sep 2026',start:'01 Sep 2026, 00:00 MYT',end:'30 Sep 2026, 23:59 MYT',issued:'01 Sep 2026, 09:00 MYT',summary:'September authorisation',action:'Inspect history'}, {id:'november',ref:null,status:'pending',label:'PENDING REVIEW',version:'—',period:'01–30 Nov 2026 · proposed',start:'01 Nov 2026, 00:00 MYT',end:'30 Nov 2026, 23:59 MYT',issued:null,summary:'November authority request',action:'Review authority'}];\nlet selected=records[0],view='overview',operation=null,dialogTrigger=null;\nconst canOperate=role==='issuer';\nconst family=status=>({current:'current',expired:'unknown',pending:'unknown',revoked:'critical',superseded:'neutral'}[status]||'neutral');\nconst badge=r=>`<span class=\"badge ${family(r.status)}\">${r.status==='current'?'▣':r.status==='expired'?'◷':'○'} ${r.label}</span>`;\nconst money=v=>Number(v)>0?'RM'+Number(v).toLocaleString('en-MY',{maximumFractionDigits:2}):'Rent not supplied';\nfunction recordHTML(r,preview=false){return `<div class=\"record\"><div class=\"record-head\"><p class=\"kicker\">${preview?'Unpublished statement':r.ref?'SafeListing Record · V'+r.version:'Authority request · Not issued'}</p><div class=\"record-period\">${preview?'Proposed authorisation':r.id?r.id.toUpperCase()+' 2026':'Authorisation'}</div><h2>${escapeHTML(r.property||(preview?'Property not supplied':'Bayu Meranti Residences'))}</h2><p>${escapeHTML(r.unit||(preview?'Unit not supplied':'Block B, Unit 12-08'))}</p></div><div class=\"record-main\"><div class=\"record-reference\">${r.ref?`<code>${escapeHTML(r.ref)}</code>`:'<span class=\"quiet-note\" style=\"margin:0\">No public reference assigned</span>'}${badge(r)}</div><dl><div><dt>${preview||!r.ref?'Proposed':'Approved'} monthly rent</dt><dd class=\"price\">${money(preview?r.rent:1850)}<small> / month</small></dd></div><div><dt>Representative</dt><dd>${escapeHTML(r.representative||(preview?'Not supplied':'Nadia Rahman'))}</dd></div><div><dt>Approved contact</dt><dd>${escapeHTML(r.contact||(preview?'Not supplied':'Nadia Rahman'))}</dd></div></dl><div class=\"meta-grid\"><div><span>${preview?'Proposed start':'Valid from'}</span><strong>${escapeHTML(r.start)}</strong></div><div><span>${preview?'Proposed expiry':'Expires'}</span><strong>${escapeHTML(r.end)}</strong></div><div><span>Issuer</span><strong>Bayu Meranti Property Management</strong></div><div><span>Scope</span><strong>Residential letting · one unit</strong></div></div><p class=\"quiet-note\">Payment recipient: NOT VERIFIED. This record does not establish bank-account control.</p>${preview?'':`<div class=\"record-actions\"><button class=\"btn btn-secondary\" data-action=\"details\">${r.status==='pending'?'View request':'Inspect lifecycle →'}</button>${r.ref?'<button class=\"btn btn-ghost\" data-action=\"copy\">Copy reference</button>':''}</div>`}</div></div>`;}\nfunction renderLedger(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const matches=records.filter(r=>(f==='all'||f===r.status)&&('Bayu Meranti Residences Block B Unit 12-08 Nadia Rahman '+(r.ref||'')+' '+r.summary).toLowerCase().includes(q));$('ledger').innerHTML=matches.length?matches.map(r=>`<button class=\"ledger-row\" data-record=\"${r.id}\" aria-pressed=\"${selected.id===r.id}\" data-od-id=\"record-${r.id}\"><div class=\"row-between\"><div><p class=\"ledger-type\">${r.ref?'AUTHORISATION · VERSION '+r.version:'SEPARATE REQUEST · UNPUBLISHED'}</p><h3>${r.id[0].toUpperCase()+r.id.slice(1)} <span>2026</span></h3><p class=\"unit\">Bayu Meranti Residences · Block B, Unit 12-08</p></div>${badge(r)}</div><div class=\"ledger-meta\"><strong>RM1,850 <span style=\"font-weight:400\">/ month</span></strong><code>${r.ref||'Authority request · Unpublished'}</code></div><div class=\"ledger-foot\"><span>${r.period}</span><span>Nadia Rahman ${selected.id===r.id?'· Selected ↗':''}</span></div></button>`).join(''):'<div class=\"no-results\"><h3>No records found.</h3><p>Try another reference or choose All records.</p></div>';$('ledger').querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{selected=records.find(r=>r.id===b.dataset.record);renderLedger();renderPreview();if(matchMedia('(max-width:900px)').matches)showView(selected.status==='pending'?'authority':'details');else $('ledger').querySelector('[data-record=\"'+selected.id+'\"]').focus({preventScroll:true});});}\nfunction renderPreview(){$('overview-preview').innerHTML='<div class=\"selection-caption\"><span>Selected statement</span><strong>'+selected.id.toUpperCase()+' 2026 · '+(selected.ref?'V'+selected.version:'REQUEST')+'</strong></div>'+recordHTML(selected)+'<div id=\"overview-life\"></div>';wireActions($('overview-preview'));mountLifecycle('overview-life',selected);}\nfunction wireActions(root){root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>b.dataset.action==='copy'?copyReference():showView(selected.status==='pending'?'authority':'details'));}\nfunction focusView(name){const heading=$(name).querySelector('h2');if(!heading)return;heading.tabIndex=-1;heading.focus({preventScroll:true});heading.scrollIntoView({block:'start',behavior:'instant'});}\n$('issuer-view').onchange=()=>{showView($('issuer-view').value);$('issuer-view').value=view;};\nfunction showView(name){if(!canOperate&&['create','manage'].includes(name)){$('global-feedback').textContent='Your role cannot prepare, issue or revoke records. Review authority or inspect published records.';return;}view=name;$('issuer-view').value=name;$('new-listing').hidden=name!=='overview';document.querySelectorAll('.view').forEach(el=>el.hidden=el.id!==name);document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('global-feedback').textContent='';if(name==='details')renderDetails();if(name==='manage')renderManage();if(name==='authority')renderAuthority();if(name==='create')renderDraft();focusView(name);try{if(window.__SLRoute)parent.postMessage({type:'safelisting:issuer-view',view:name},'*');}catch{} }\nfunction renderDetails(){const r=selected;const pending=r.status==='pending';$('detail-content').innerHTML=`<div class=\"detail-hero\"><div><p class=\"kicker\">${pending?'Authority request':'Published statement / Version '+r.version}</p><h2>${r.id[0].toUpperCase()+r.id.slice(1)} 2026 <span class=\"detail-version\">${r.ref?\"/ V\"+r.version:\"/ REQUEST\"}</span></h2><p>Bayu Meranti Residences · Block B, Unit 12-08</p><p>${r.ref?'<code>'+r.ref+'</code>':'No public reference. Not yet issued.'}</p></div>${badge(r)}</div><div class=\"split\"><div><p class=\"quiet-note\" style=\"margin-top:0\">${pending?'Separate period reques
